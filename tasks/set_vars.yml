---
# role: unpoller
# file: tasks/set_vars.yml

- name: set_vars | Gather distribution facts
  ansible.builtin.setup:
    gather_subset: '{{ __unpoller_required_facts_subsets }}'
  when: __unpoller_required_facts | difference(ansible_facts.keys()) | length > 0

- name: set_vars | Load the distribution verification package
  ansible.builtin.include_vars: '{{ ansible_facts.os_family }}.yml'
