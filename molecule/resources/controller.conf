# Serve just the local UniFi OS endpoints exercised by the exporter.
events {}
http {
    access_log off;
    default_type application/json;
    map "$http_x_api_key:$cookie_session" $authorized {
        default 0;
        "molecule-api-key:" 1;
        ":molecule-session" 1;
    }
    server {
        listen 127.0.0.1:19443 ssl;
        ssl_certificate /etc/unpoller-fixture/controller.crt;
        ssl_certificate_key /etc/unpoller-fixture/controller.key;
        location = / { return 200 '{}'; }
        location = /api/auth/login {
            add_header Set-Cookie "session=molecule-session; Path=/; Secure";
            return 200 '{}';
        }
        location /proxy/network/ {
            if ($authorized = 0) { return 401; }
            location ~ /status$ {
                if ($authorized = 0) { return 401; }
                return 200 '{"meta":{"rc":"ok","server_version":"9.0.0"},"data":[]}';
            }
            location ~ /sites$ {
                if ($authorized = 0) { return 401; }
                return 200 '{"meta":{"rc":"ok"},"data":[{"name":"default","desc":"Molecule","_id":"1","health":[{"subsystem":"wlan","status":"ok","num_ap":7}]}]}';
            }
            return 200 '{"meta":{"rc":"ok"},"data":[]}';
        }
    }
}
