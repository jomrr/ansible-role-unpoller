---
# role: unpoller
# file: handlers/main.yml

- name: Restart the exporter
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: unpoller.service
    daemon_reload: true
    state: restarted
  listen: restart unpoller

- name: Restart the update timer
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: unpoller-update.timer
    daemon_reload: true
    state: restarted
  listen: restart update timer
